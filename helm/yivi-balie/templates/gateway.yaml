apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: yivi
spec:
  secretName: yivi-gateway-tls-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - "yivi-server.prod.brainhive.nl"

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-read-cert
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: default
  to:
    - group: ""
      kind: Secret
      name: tls-cert-irma-server
    - group: ""
      kind: Secret
      name: tls-cert-balie-server
